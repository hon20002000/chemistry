<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CH7 電子轉移示意</title>
  <style>
    body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#fff;color:#213547;padding:20px;line-height:1.7}
    .wrap{border:1px solid #d8e3ec;border-radius:18px;padding:20px;background:#f8fbfd}
    h2{margin-top:0;color:#115e59}.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:20px 0}
    .atom{width:120px;min-height:160px;border:1px solid #cddbe7;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700}
    .atom small{font-size:1rem;color:#5c6f82;font-weight:400}.arrow{font-size:2rem;color:#0f766e;font-weight:700}
    .electron{display:inline-block;padding:8px 12px;border-radius:999px;background:#ddf4f1;color:#115e59;font-weight:700}
  </style>
</head>
<body>
  <section class="wrap">
    <h2>電子轉移示意</h2>
    <p>這是一個可直接替換的嵌入模版。你可以改成任何章節所需的動畫或 HTML 演示。</p>
    <div class="row">
      <div class="atom">Na<small>2,8,1</small></div>
      <div class="electron">e<sup>-</sup></div>
      <div class="arrow">→</div>
      <div class="atom">Cl<small>2,8,7</small></div>
    </div>
    <div class="row">
      <div class="atom">Na<sup>+</sup><small>2,8</small></div>
      <div class="arrow">+</div>
      <div class="atom">Cl<sup>-</sup><small>2,8,8</small></div>
    </div>
    <p>教師可改的地方：元素、電子層排布、文字說明、動畫效果、題目按鈕。</p>
  </section>
</body>
</html>
