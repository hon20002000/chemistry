  <details>
    <summary>題目 1：鈉原子生成鈉離子時，失去多少個電子？</summary>
    <p>答案：1 個。鈉原子的電子排佈是 2,8,1，失去 1 個最外層電子後形成 Na+。[file:344]</p>
  </details>

  <details>
    <summary>題目 2：氯原子生成氯離子時，獲得多少個電子？</summary>
    <p>答案：1 個。氯原子獲得 1 個電子後可達致穩定電子排佈，因此形成 Cl-。[file:344]</p>
  </details>

  <details>
    <summary>題目 3：離子鍵是甚麼？</summary>
    <p>答案：帶相反電荷離子之間的靜電引力。[file:344]</p>
  </details>
</section>
